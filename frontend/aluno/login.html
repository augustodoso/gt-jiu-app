<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login do Aluno - GT Jiu</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- FAVICON AUREVIX -->
  <link rel="icon" type="image/png" href="../img/logo-aurevix.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shell {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .topo-identidade {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-topo {
      width: 40px;
      height: auto;
    }

    .topo-titulos h1 {
      margin: 0;
      font-size: 32px;
    }

    .topo-titulos p {
      margin: 2px 0 0;
      font-size: 14px;
      opacity: 0.85;
    }

    .btn-voltar {
      background: transparent;
      border: 1px solid #444;
      color: #f5f5f5;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-voltar:hover {
      background: #111;
    }

    .card-login {
      background: #111;
      border-radius: 16px;
      padding: 24px 24px 26px;
      max-width: 460px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }

    .card-login h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .card-login p {
      margin: 0 0 18px;
      font-size: 14px;
      opacity: 0.9;
    }

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .campo input {
      width: 100%;
      border-radius: 8px;
      border: none;
      padding: 10px 12px;
      font-size: 14px;
      background: #181818;
      color: #f5f5f5;
    }

    .campo input::placeholder {
      color: #777;
    }

    .lgpd-termo {
      margin-top: 6px;
      font-size: 12px;
      color: #ccc;
    }

    .lgpd-termo label {
      cursor: pointer;
    }

    .lgpd-termo input {
      margin-right: 6px;
    }

    .lgpd-termo a {
      color: #ff6b6b;
      text-decoration: none;
    }

    .lgpd-termo a:hover {
      text-decoration: underline;
    }

    .acoes {
      margin-top: 18px;
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primario {
      background: #1f7aff;
      border: none;
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-primario:hover {
      opacity: 0.9;
    }

    .status-login {
      font-size: 12px;
      opacity: 0.85;
    }

    /* Rodapé Aurevix */
    .assinatura-aurevix {
      margin-top: 18px;
      font-size: 12px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.9;
    }

    .assinatura-aurevix img {
      width: 32px;
      height: auto;
    }
  </style>
</head>
<body>

<div class="shell">
  <div class="topo">
    <div class="topo-identidade">
      <!-- Logo GT Jiu -->
      <img src="../img/logo-gtjiu-aurevix.png" alt="GT Jiu" class="logo-topo">
      <div class="topo-titulos">
        <h1>GT Jiu</h1>
        <p>Painel do Aluno • Acesso com código</p>
      </div>
    </div>
    <button class="btn-voltar" onclick="voltarInicio()">Voltar</button>
  </div>

  <div class="card-login">
    <h2>Entrar como aluno</h2>
    <p>Use o código fornecido pela sua academia para acessar o painel.</p>

    <form id="formAluno" onsubmit="handleLoginAluno(event)">
      <div class="campo">
        <label for="codigoAluno">Código de acesso</label>
        <input
          type="text"
          id="codigoAluno"
          placeholder="Ex: GTJ-123456"
          required
        >
      </div>

      <div class="lgpd-termo">
        <label>
          <input type="checkbox" id="lgpdAluno">
          Li e aceito a
          <a href="../termos/lgpd.html" target="_blank">
            Política de Privacidade e LGPD
          </a>.
        </label>
      </div>

      <div class="acoes">
        <button type="submit" class="btn-primario">Entrar</button>
        <span class="status-login" id="statusAluno">Deslogado</span>
      </div>
    </form>
  </div>

  <!-- Rodapé Aurevix -->
  <div class="assinatura-aurevix">
    <img src="../img/logo-aurevix-avx.png" alt="Aurevix Tech">
    <span>Desenvolvido por Aurevix • </span>
  </div>
</div>

<script>
  const API_BASE_URL = "https://gt-jiu-app.onrender.com";
  const KEY_ALUNO_LOGADO = "gtjiu_aluno_logado";

  function voltarInicio() {
    window.location.href = "../index.html";
  }

  // Se já tiver login salvo, mostra status
  (function initStatus() {
    const logadoStr = localStorage.getItem(KEY_ALUNO_LOGADO);
    if (logadoStr) {
      document.getElementById("statusAluno").textContent = "Já logado";
    }
  })();

  async function handleLoginAluno(event) {
    event.preventDefault();

    const codigo = document.getElementById("codigoAluno").value.trim();
    const aceitouLgpd = document.getElementById("lgpdAluno").checked;
    const statusSpan = document.getElementById("statusAluno");

    if (!aceitouLgpd) {
      alert("Para continuar, é necessário aceitar a Política de Privacidade / LGPD.");
      return;
    }

    if (!codigo) {
      alert("Preencha o código de acesso.");
      return;
    }

    statusSpan.textContent = "Verificando...";

    try {
      const resp = await fetch(`${API_BASE_URL}/alunos/login`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ codigo }),
      });

      if (!resp.ok) {
        if (resp.status === 404) {
          alert("Código não encontrado. Verifique com a sua academia.");
        } else {
          alert("Erro ao fazer login. Tente novamente em instantes.");
        }
        statusSpan.textContent = "Erro no login";
        return;
      }

      const data = await resp.json();

      // Guarda infos básicas do aluno no navegador
      const alunoInfo = {
        id: data.id,
        nome: data.nome,
        academia_id: data.academia_id,
        codigo: data.codigo,
      };

      localStorage.setItem(KEY_ALUNO_LOGADO, JSON.stringify(alunoInfo));
      statusSpan.textContent = "Login realizado";

      // Ajuste aqui o nome do dashboard do aluno
      window.location.href = "./dashboard.html";
    } catch (err) {
      console.error(err);
      alert("Erro de rede ao tentar fazer login. Confira sua internet.");
      statusSpan.textContent = "Erro no login";
    }
  }
</script>


</body>
</html>
