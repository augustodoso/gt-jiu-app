<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login do Professor - GT Jiu</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="../img/logo-aurevix.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shell {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .topo-identidade {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-topo {
      width: 40px;
      height: auto;
    }

    .topo-titulos h1 {
      margin: 0;
      font-size: 32px;
    }

    .topo-titulos p {
      margin: 2px 0 0;
      font-size: 14px;
      opacity: 0.85;
    }

    .btn-voltar {
      background: transparent;
      border: 1px solid #444;
      color: #f5f5f5;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-voltar:hover {
      background: #111;
    }

    .card-login {
      background: #111;
      border-radius: 16px;
      padding: 24px 24px 26px;
      max-width: 460px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }

    .card-login h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .card-login p {
      margin: 0 0 18px;
      font-size: 14px;
      opacity: 0.9;
    }

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .campo input {
      width: 100%;
      border-radius: 8px;
      border: none;
      padding: 10px 12px;
      font-size: 14px;
      background: #181818;
      color: #f5f5f5;
    }

    .campo input::placeholder {
      color: #777;
    }

    .lgpd-termo {
      margin-top: 6px;
      font-size: 12px;
      color: #ccc;
    }

    .lgpd-termo label {
      cursor: pointer;
    }

    .lgpd-termo input {
      margin-right: 6px;
    }

    .lgpd-termo a {
      color: #ff6b6b;
      text-decoration: none;
    }

    .lgpd-termo a:hover {
      text-decoration: underline;
    }

    .acoes {
      margin-top: 18px;
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primario {
      background: #ff4444;
      border: none;
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-primario:hover {
      opacity: 0.9;
    }

    .status-login {
      font-size: 12px;
      opacity: 0.85;
    }

    /* Rodapé Aurevix */
    .assinatura-aurevix {
      margin-top: 18px;
      font-size: 12px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.9;
    }

    .assinatura-aurevix img {
      width: 32px;
      height: auto;
    }
  </style>
</head>
<body>

<div class="shell">
  <div class="topo">
    <div class="topo-identidade">
      <!-- Logo GT Jiu no topo -->
      <img src="../img/logo-gtjiu-aurevix.png" alt="GT Jiu" class="logo-topo">
      <div class="topo-titulos">
        <h1>GT Jiu</h1>
        <p>Painel do Professor • Acesso restrito</p>
      </div>
    </div>
    <button class="btn-voltar" onclick="voltarInicio()">Voltar</button>
  </div>

  <div class="card-login">
    <h2>Entrar como professor</h2>
    <p>Use o e-mail e senha cadastrados para acessar o painel da sua academia.</p>

    <form id="formProfessor" onsubmit="handleLoginProfessor(event)">
      <div class="campo">
        <label for="emailProfessor">E-mail</label>
        <input
          type="email"
          id="emailProfessor"
          placeholder="voce@academia.com"
          required
        >
      </div>

      <div class="campo">
        <label for="senhaProfessor">Senha</label>
        <input
          type="password"
          id="senhaProfessor"
          placeholder="Sua senha"
          required
        >
      </div>

      <div class="lgpd-termo">
        <label>
          <input type="checkbox" id="lgpdProfessor">
          Li e aceito a
          <a href="../termos/lgpd.html" target="_blank">
            Política de Privacidade e LGPD
          </a>.
        </label>
      </div>

      <div class="acoes">
        <button type="submit" class="btn-primario">Entrar</button>

        <button
          type="button"
          class="btn-primario"
          style="background:#444;"
          onclick="abrirTelaRegistroProfessor()"
        >
          Registrar conta
        </button>

        <span class="status-login" id="statusProfessor">Deslogado</span>
      </div>
    </form>
  </div>

  <!-- Rodapé Aurevix -->
  <div class="assinatura-aurevix">
    <img src="../img/logo-aurevix-avx.png" alt="Aurevix Tech">
    <span>Desenvolvido por Aurevix • </span>
  </div>
</div>

<script>
  const API_BASE_URL = "https://gt-jiu-app.onrender.com"; 
  const TOKEN_KEY  = "gtjiu_professor_token";
  const NOME_KEY   = "gtjiu_professor_nome";
  const EMAIL_KEY  = "gtjiu_professor_email";

  function voltarInicio() {
    window.location.href = "../index.html";
  }

  function abrirTelaRegistroProfessor() {
    window.location.href = "./register_professor.html";
  }

  // Só para mostrar o status no rodapé do card
  (function initStatus() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) {
      const span = document.getElementById("statusProfessor");
      if (span) span.textContent = "Já logado";
    }
  })();

  async function handleLoginProfessor(event) {
    event.preventDefault();

    const email = document.getElementById("emailProfessor").value.trim();
    const senha = document.getElementById("senhaProfessor").value.trim();
    const aceitouLgpd = document.getElementById("lgpdProfessor").checked;
    const statusSpan = document.getElementById("statusProfessor");

    if (!aceitouLgpd) {
      alert("Para continuar, é necessário aceitar a Política de Privacidade / LGPD.");
      return;
    }

    if (!email || !senha) {
      alert("Preencha e-mail e senha.");
      return;
    }

    statusSpan.textContent = "Verificando...";

    try {
      const resp = await fetch(`${API_BASE_URL}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha })
      });

      if (!resp.ok) {
        const dataErro = await resp.json().catch(() => ({}));
        const msg = dataErro.detail || "Erro ao fazer login. Verifique os dados.";
        alert(msg);
        statusSpan.textContent = "Erro no login";
        return;
      }

      const data = await resp.json();

      // 🔐 Salva token e dados no localStorage
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(NOME_KEY, data.nome || "");
      localStorage.setItem(EMAIL_KEY, email);

      statusSpan.textContent = "Login realizado";

      // Vai para o painel do professor
      window.location.href = "./dashboard.html";
    } catch (err) {
      console.error(err);
      alert("Não foi possível conectar ao servidor. Verifique sua conexão e tente novamente.");
      statusSpan.textContent = "Erro de conexão";
    }
  }
</script>

</body>
</html>
