<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Alunos - GT JIU</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .form-box, .lista-box {
      background: #181818;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin: 5px 0 12px 0;
      border-radius: 6px;
      border: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid #333;
      padding: 8px;
      text-align: left;
    }
    .status-ok {
      color: #4caf50;
    }
    .status-alerta {
      color: #ffc107;
    }
    .status-atrasado {
      color: #ff5252;
    }
    .btn-mini {
      padding: 5px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <h1>Alunos</h1>
    <button class="btn" style="background:#444;" onclick="voltarDashboard()">Voltar</button>
  </div>

  <p id="boasVindas"></p>

  <!-- FORMULÁRIO DE CADASTRO -->
  <div class="form-box">
    <h3>Cadastrar novo aluno</h3>
    <form id="formAluno">
      <label>Nome do aluno</label>
      <input type="text" id="nome" required>

      <label>Plano / Observação</label>
      <input type="text" id="plano" placeholder="Ex: Jiu 3x por semana">

      <label>Valor da mensalidade (R$)</label>
      <input type="number" step="0.01" id="valor" placeholder="Ex: 150.00" required>

      <label>Dia de vencimento</label>
      <input type="number" id="diaVencimento" min="1" max="31" placeholder="Ex: 10" required>

      <button type="submit" class="btn">Salvar aluno</button>
    </form>
  </div>

  <!-- LISTA DE ALUNOS -->
  <div class="lista-box">
    <h3>Alunos cadastrados</h3>
    <table id="tabelaAlunos">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Código</th>
          <th>Plano</th>
          <th>Mensalidade</th>
          <th>Vencimento</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <!-- linhas geradas via JS -->
      </tbody>
    </table>
  </div>

</div>

<script>
  const API_BASE_URL = "https://gt-jiu-app.onrender.com";

  // --------- CHAVES DO LOGIN NOVO ----------
  const TOKEN_KEY  = "gtjiu_professor_token";
  const NOME_KEY   = "gtjiu_professor_nome";
  const EMAIL_KEY  = "gtjiu_professor_email";
  // se um dia você salvar o ID da academia no login, podemos usar esta chave:
  const ACADEMIA_ID_KEY = "gtjiu_academia_id";

  const boasVindas = document.getElementById("boasVindas");

  // Guarda de rota – só entra aqui se tiver token
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) {
    alert("Você precisa estar logado como professor.");
    window.location.href = "login.html";
  }

  // Dados do professor vindos do login
  const professorNome  = localStorage.getItem(NOME_KEY)  || "Professor";
  const professorEmail = localStorage.getItem(EMAIL_KEY) || "";

  boasVindas.textContent = `Gerenciando alunos do professor: ${professorNome}`;

  // --------- HELPERS LOCALSTORAGE ----------
  function pegarAlunos() {
    const lista = JSON.parse(localStorage.getItem("gtjiu_alunos") || "[]");
    // filtra só alunos desse professor (pelo e-mail salvo no login)
    return lista.filter((al) => al.professorEmail === professorEmail);
  }

  function salvarAlunoListaCompleta(novaListaDoProfessor) {
    const listaGlobal = JSON.parse(localStorage.getItem("gtjiu_alunos") || "[]");
    // remove alunos deste professor
    const filtrada = listaGlobal.filter(
      (al) => al.professorEmail !== professorEmail
    );
    const final = filtrada.concat(novaListaDoProfessor);
    localStorage.setItem("gtjiu_alunos", JSON.stringify(final));
  }

  // --------- STATUS FINANCEIRO ----------
  function calcularStatus(diaVencimento) {
    const hoje = new Date();
    const dia = hoje.getDate();

    if (dia > diaVencimento + 3) {
      return { texto: "Atrasado", classe: "status-atrasado" };
    } else if (dia >= diaVencimento - 3 && dia <= diaVencimento + 3) {
      return { texto: "Vence agora", classe: "status-alerta" };
    } else {
      return { texto: "Em dia", classe: "status-ok" };
    }
  }

  // --------- CHAMADA AO BACKEND PARA CRIAR ALUNO ----------
  async function criarAlunoBackend(nome) {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
      alert("Sessão expirada. Faça login novamente como professor.");
      window.location.href = "login.html";
      throw new Error("Sem token");
    }

    // Por enquanto vamos fixar academia_id = 1,
    // que é a mesma que você usou nos testes do Swagger.
    // Se você já tiver salvo um ID no localStorage, podemos usar:
    let academiaId = 1;
    const acadStr = localStorage.getItem(ACADEMIA_ID_KEY);
    if (acadStr) {
      const parsed = parseInt(acadStr, 10);
      if (!isNaN(parsed)) {
        academiaId = parsed;
      }
    }

    const resp = await fetch(`${API_BASE_URL}/alunos`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({
        nome: nome,
        academia_id: academiaId,
      }),
    });

    const text = await resp.text();
    let data;
    try {
      data = text ? JSON.parse(text) : null;
    } catch {
      data = text;
    }

    if (!resp.ok) {
      console.error("Erro ao criar aluno no backend:", resp.status, data);
      if (resp.status === 401 || resp.status === 403) {
        alert("Sessão expirada ou não autorizada. Entre novamente como professor.");
        window.location.href = "login.html";
      } else {
        alert("Não foi possível criar o aluno no servidor. Tente novamente.");
      }
      throw new Error("Erro ao criar aluno no backend");
    }

    // Deve vir: {id, nome, academia_id, codigo}
    if (!data || !data.codigo) {
      console.error("Resposta inesperada ao criar aluno:", data);
      alert("Erro inesperado ao criar aluno no servidor.");
      throw new Error("Resposta sem código");
    }

    return data;
  }

  // --------- RENDERIZAR TABELA ----------
  function renderTabela() {
    const tbody = document.querySelector("#tabelaAlunos tbody");
    tbody.innerHTML = "";

    const alunos = pegarAlunos();
    alunos.forEach((aluno, idx) => {
      const status = calcularStatus(aluno.diaVencimento);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${aluno.nome}</td>
        <td>${aluno.idAluno}</td>
        <td>${aluno.plano || "-"}</td>
        <td>R$ ${Number(aluno.valor).toFixed(2)}</td>
        <td>Dia ${aluno.diaVencimento}</td>
        <td class="${status.classe}">${status.texto}</td>
        <td>
          <button class="btn btn-mini" style="background:#555;" onclick="removerAluno(${idx})">
            Remover
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --------- REMOVER ALUNO ----------
  function removerAluno(indice) {
    const alunos = pegarAlunos();
    if (!confirm(`Remover o aluno "${alunos[indice].nome}"?`)) return;
    alunos.splice(indice, 1);
    salvarAlunoListaCompleta(alunos);
    renderTabela();
  }
  window.removerAluno = removerAluno; // expõe para o onclick

  // --------- CADASTRO DE ALUNO (AGORA CHAMANDO BACKEND) ----------
  const form = document.getElementById("formAluno");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const plano = document.getElementById("plano").value.trim();
    const valor = parseFloat(document.getElementById("valor").value);
    const diaVencimento = parseInt(
      document.getElementById("diaVencimento").value,
      10
    );

    if (!nome || isNaN(valor) || isNaN(diaVencimento)) {
      alert("Preencha todos os campos obrigatórios.");
      return;
    }

    try {
      // 1) cria no backend, pega o código oficial
      const alunoBackend = await criarAlunoBackend(nome);
      const codigo = alunoBackend.codigo;

      // 2) salva dados financeiros + código localmente para o professor
      const alunos = pegarAlunos();
      alunos.push({
        professorEmail: professorEmail,
        idAluno: codigo, // este é o código de acesso do aluno
        nome,
        plano,
        valor,
        diaVencimento,
      });

      salvarAlunoListaCompleta(alunos);
      form.reset();
      renderTabela();

      alert(
        `Aluno salvo com sucesso!\n\nNome: ${nome}\nCódigo de acesso do aluno: ${codigo}`
      );
    } catch (err) {
      console.error("Erro no fluxo de cadastro de aluno:", err);
      // os alerts de erro já foram disparados dentro das funções
    }
  });

  function voltarDashboard() {
    window.location.href = "dashboard.html";
  }

  // inicializa tabela
  renderTabela();
</script>
</body>
</html>
